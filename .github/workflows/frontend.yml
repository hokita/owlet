name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

concurrency:
  group: frontend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        env:
          # Firebase client config is public-facing — security enforced by Firestore
          # Security Rules and the backend's authMiddleware, not by keeping keys secret.
          VITE_FIREBASE_API_KEY: AIzaSyCrGQQeKKwX5MvNPeDT2xoJOAY8xk00jGA
          VITE_FIREBASE_AUTH_DOMAIN: owlet-c659da.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: owlet-c659da
          VITE_API_URL: https://owlet-backend-185845390027.asia-northeast1.run.app
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: owlet-c659da
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools@15.22.1 deploy --only hosting --project owlet-c659da --non-interactive
