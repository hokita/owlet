name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.3'

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Test
        working-directory: backend
        run: npm test

      - name: Build
        working-directory: backend
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: owlet-c659da
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: backend
          push: true
          tags: asia-northeast1-docker.pkg.dev/owlet-c659da/owlet/backend:latest

      - name: Deploy to Cloud Run
        env:
          API_TOKEN_SECRET: ${{ vars.OWLET_API_TOKEN_SECRET }}
        run: |
          SECRETS="ALLOWED_EMAILS=ALLOWED_EMAILS:latest"
          if [ -n "$API_TOKEN_SECRET" ]; then
            SECRETS="$SECRETS,OWLET_API_TOKEN=${API_TOKEN_SECRET}:latest"
          fi
          gcloud run deploy owlet-backend \
            --image asia-northeast1-docker.pkg.dev/owlet-c659da/owlet/backend:latest \
            --region asia-northeast1 \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 2 \
            --set-env-vars "FIREBASE_PROJECT_ID=owlet-c659da,FRONTEND_URL=https://owlet-c659da.web.app" \
            --set-secrets "$SECRETS"
