name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Test
        working-directory: backend
        run: npm test

      - name: Build
        working-directory: backend
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: owlet-c659da
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: docker/setup-buildx-action@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: asia-northeast1-docker.pkg.dev/owlet-c659da/owlet/backend:latest

      - name: Deploy to Cloud Run
        env:
          # Name of the Secret Manager secret holding OWLET_API_TOKEN. Cloud Run
          # fails a deploy that references a missing secret, so agent token auth
          # is wired in only once the owner has created it and set this repo
          # variable (see README, "Agent notes").
          API_TOKEN_SECRET: ${{ vars.OWLET_API_TOKEN_SECRET }}
        run: |
          SECRETS="ALLOWED_EMAILS=ALLOWED_EMAILS:latest"
          if [ -n "$API_TOKEN_SECRET" ]; then
            SECRETS="$SECRETS,OWLET_API_TOKEN=${API_TOKEN_SECRET}:latest"
          fi
          gcloud run deploy owlet-backend \
            --image asia-northeast1-docker.pkg.dev/owlet-c659da/owlet/backend:latest \
            --region asia-northeast1 \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 2 \
            --set-env-vars "FIREBASE_PROJECT_ID=owlet-c659da,FRONTEND_URL=https://owlet-c659da.web.app" \
            --set-secrets "$SECRETS"
